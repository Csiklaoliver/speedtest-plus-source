name: iOS unsigned IPA build artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      THEOS: ${{ github.workspace }}/.theos-ci
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid

      - name: Install Theos
        run: git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

      - name: Compile the tweak
        run: make clean package FINALPACKAGE=1

      - name: Download the previous clean unsigned base
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.4.9/SpeedtestPlus-iOS-0.1.5-unsigned.ipa" \
            --output "$RUNNER_TEMP/SpeedtestPlus-base.ipa"

      - name: Locate the compiled library
        id: dylib
        run: |
          dylib="$(find .theos/obj -type f -name SpeedtestPlus.dylib -not -path '*dSYM*' | head -n 1)"
          test -n "$dylib"
          echo "path=$PWD/$dylib" >> "$GITHUB_OUTPUT"

      - name: Package the unsigned IPA
        run: |
          python3 -m venv "$RUNNER_TEMP/speedtestplus-venv"
          "$RUNNER_TEMP/speedtestplus-venv/bin/python" -m pip install --disable-pip-version-check lief
          "$RUNNER_TEMP/speedtestplus-venv/bin/python" Scripts/build_unsigned_ipa.py \
            --input "$RUNNER_TEMP/SpeedtestPlus-base.ipa" \
            --dylib "${{ steps.dylib.outputs.path }}" \
            --output "$RUNNER_TEMP/SpeedtestPlus-iOS-0.1.19-bottom-controls-unsigned.ipa"
          "$RUNNER_TEMP/speedtestplus-venv/bin/python" Scripts/inspect_ipa.py \
            "$RUNNER_TEMP/SpeedtestPlus-iOS-0.1.19-bottom-controls-unsigned.ipa" \
            --output "$RUNNER_TEMP/ipa-report.json"
          "$RUNNER_TEMP/speedtestplus-venv/bin/python" Scripts/verify_hook_map.py "$RUNNER_TEMP/ipa-report.json"

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: SpeedtestPlus-iOS-0.1.19-for-docs-release
          path: |
            ${{ runner.temp }}/SpeedtestPlus-iOS-0.1.19-bottom-controls-unsigned.ipa
            ${{ runner.temp }}/ipa-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Show publication destination
        run: |
          {
            echo "### Publication destination"
            echo "This workflow intentionally creates a CI artifact only."
            echo "Publish public iOS/Android binaries and OTA metadata in speedtest-plus-docs."
          } >> "$GITHUB_STEP_SUMMARY"

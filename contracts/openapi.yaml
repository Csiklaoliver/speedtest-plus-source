openapi: 3.1.0
info:
  title: Speedtest+ public client API
  version: 1.0.0
  description: Consent-gated aggregate telemetry and explicit bug reports.
servers:
  - url: https://speedtest.example.invalid
paths:
  /v1/events:
    post:
      summary: Accept a bounded batch of consented aggregate events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schemaVersion, events]
              properties:
                schemaVersion:
                  const: 1
                events:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: ../schemas/telemetry-event.schema.json
      responses:
        "202":
          description: Accepted
        "400":
          description: Invalid payload
        "429":
          description: Rate limited
  /v1/bug-reports:
    post:
      summary: Submit a user-reviewed bug report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/bug-report.schema.json
      responses:
        "201":
          description: Created
        "400":
          description: Invalid payload
        "413":
          description: Payload too large
        "429":
          description: Rate limited
